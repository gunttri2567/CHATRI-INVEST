<!DOCTYPE html> 
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover">
  <title>My LIFF</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <center>
    <div class="row g-2">
      <div class="col-md">
        <div class="mb-3">
          <label class="form-label">JSON - </label>
          <a href="https://developers.line.biz/flex-simulator" target="_blank" class="link-info">FLEX MESSAGE SIMULATOR</a>
          <textarea class="form-control" id="flexjson" name="flexjson" rows="20" onchange="myFunction()">
{
  "type": "bubble",
  "body": {
    "type": "box",
    "layout": "vertical",
    "contents": [
      {"type": "text", "text": "hello"}
    ]
  }
}
          </textarea>  
        </div>
      </div>
    </div>

    <br>
    <div class="input-group mb-3">
      <input type="text" class="form-control" id="demo" placeholder="Ctrl+C > Copy liff url.">
      <div class="input-group-append">
        <button class="btn btn-outline-secondary" type="button">Button</button>
      </div>
    </div>

    <br>
    <button class="btn btn-outline-primary" onclick="flex_1()">Flex1</button>
    <button class="btn btn-outline-primary" onclick="flex_2()">Flex2</button>
    <button class="btn btn-outline-primary" onclick="flex_3()">Flex3</button>
    <button class="btn btn-outline-primary" onclick="flex_4()">Flex4</button>

    <br>
    <button class="btn btn-success" onclick="saveShare()">Save liff</button>
    <button class="btn btn-success" onclick="sendShare()">Share Target Picker</button>
  </center>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
async function main() {
  await liff.init({ liffId: "2000581772-nBKodMO3" }); // ใส่ LIFF ID ของคุณ
  if (!liff.isLoggedIn()) {
    // ไม่ redirect login อัตโนมัติ แต่สามารถ login ตามปุ่มเองได้
    console.log("User not logged in, skip redirect.");
  } else {
    js_onload_code();
  }
}

main();

// โหลดค่า flexid จาก URL อย่างปลอดภัย
function js_onload_code() {
  const params = new URLSearchParams(window.location.search);
  const exc = params.get('flexid'); // ถ้าไม่มีจะเป็น null
  if (!exc) return;

  const xurl = "https://script.google.com/macros/s/AKfycbwktB_ZSm_VDDImG85Q4abmjDcBGHQqusr4PMsoWlT1d9fsADr6NaaM81uBnqq4exVL/exec"; 
  const xmlhttp = new XMLHttpRequest();
  xmlhttp.open('GET', xurl + '?flexid=' + exc);
  xmlhttp.send();
  xmlhttp.onreadystatechange = function() {
    if (this.readyState === 4 && this.status === 200) {
      try {
        const jsonResponse = JSON.parse(this.responseText);
        if (jsonResponse.desc) {
          const decoded = window.atob(jsonResponse.desc);
          document.getElementById("flexjson").value = decoded;
        }
      } catch(err) {
        console.error("Error parsing response:", err);
      }
    }
  }
}

// ปุ่มเลือก flex
function flex_1() { setFlexText("start"); }
function flex_2() { setFlexText("center"); }
function flex_3() { setFlexText("end"); }
function flex_4() { 
  const f = { "type":"bubble", "body":{"type":"box","layout":"vertical","contents":[{"type":"text","text":"hello","color":"#ff0000"}]}};
  document.getElementById("flexjson").value = JSON.stringify(f);
}
function setFlexText(align) {
  const f = { "type":"bubble", "body":{"type":"box","layout":"vertical","contents":[{"type":"text","text":"hello","align":align}]}};
  document.getElementById("flexjson").value = JSON.stringify(f);
}

// แปลง textarea เป็น object สำหรับส่ง
function myFunction() {
  const x = document.getElementById("flexjson").value;
  try {
    const obj = JSON.parse(x);
    return { type: "flex", altText: "Flex", contents: obj };
  } catch(err) {
    console.error(err);
    return "failed";
  }
}

// บันทึกและแชร์
function saveShare() {
  const sflex = document.getElementById("flexjson").value;
  const code = window.btoa(JSON.stringify(sflex));
  const lid = "lid"+Date.now();
  document.getElementById("demo").value = "https://liff.line.me/2000581772-nBKodMO3/?flexid="+lid;

  const xurl = "https://script.google.com/macros/s/AKfycbwktB_ZSm_VDDImG85Q4abmjDcBGHQqusr4PMsoWlT1d9fsADr6NaaM81uBnqq4exVL/exec";
  const xmlhttp = new XMLHttpRequest();
  xmlhttp.open("POST", xurl);
  xmlhttp.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
  xmlhttp.send(JSON.stringify({ lid, code }));

  xmlhttp.onreadystatechange = function() {
    if (this.readyState === 4 && this.status === 200) {
      try {
        const jsonResponse = JSON.parse(this.responseText);
        if (jsonResponse.desc) alert(jsonResponse.desc);
      } catch(err) {
        console.error(err);
      }
    }
  }
}

async function sendShare() {
  const flexObj = myFunction();
  if (flexObj !== "failed") {
    const result = await liff.shareTargetPicker([flexObj]);
    if (result) {
      alert(`[${result.status}] Message sent!`);
      liff.closeWindow();
    } else {
      alert('ShareTargetPicker canceled.');
    }
  } else {
    alert("JSON Incorrect.");
  }
}

function logOut() {
  liff.logout();
  window.location.reload();
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
