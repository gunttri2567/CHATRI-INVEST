<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover">
<title>CHATRI AYA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { padding: 20px; }
  #previewArea { border: 1px solid #ddd; border-radius: 16px; padding: 12px; background: #f5f7fb; min-height: 420px; max-width: 380px; overflow: auto; }
  .flex-bubble { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 6px 14px rgba(0,0,0,0.08); margin-bottom: 16px; }
  .flex-hero img { width: 100%; display: block; }
  .section { padding: 12px; }
  .flex-footer { border-top: 1px solid #eee; }
  .box { display: flex; gap: 8px; }
  .box.vertical { flex-direction: column; }
  .box.horizontal { flex-direction: row; align-items: center; }
  .box.baseline { flex-direction: row; align-items: baseline; }
  .text { word-break: break-word; line-height: 1.4; }
  .t-xs{font-size:12px;} .t-sm{font-size:14px;} .t-md{font-size:16px;}
  .t-lg{font-size:18px;} .t-xl{font-size:20px;} .t-xxl{font-size:22px;}
  .btn-flex { display:inline-block; padding:10px 14px; border-radius:10px; text-decoration:none; border:1px solid #0d6efd; color:#0d6efd; }
  .btn-flex.primary { background:#0d6efd; color:#fff; border-color:#0d6efd; }
  .btn-flex.link { border: none; padding: 0; color:#0d6efd; }
  .sep { border-top:1px solid #e5e7eb; margin:6px 0; }
  .icon { width: 20px; height: 20px; display:inline-block; }
</style>
</head>
<body>

<div class="row g-3">
  <!-- ฟอร์ม -->
  <div class="col-md-6">
    <h4>Flex Form</h4>

    <div class="mb-2">
      <label for="flexjson" class="form-label">JSON</label>
      <a href="https://developers.line.biz/flex-simulator" target="_blank" class="link-info ms-2">FLEX MESSAGE SIMULATOR</a>
      <textarea class="form-control" id="flexjson" name="flexjson" rows="20">{
  "type": "bubble",
  "size": "giga",
  "hero": {
    "type": "image",
    "url": "1035089 (1).jpg",
    "size": "full",
    "aspectRatio": "1108:1478",
    "aspectMode": "cover",
    "action": { "type": "uri", "uri": "1035089 (1).jpg" }
  }
}</textarea>
    </div>

    <div class="mb-2">
      <label for="altText" class="form-label">altText</label>
      <input type="text" class="form-control" id="altText" placeholder="ข้อความสั้น ๆ ที่จะแสดงแทน Flex Message">
    </div>

    <div class="input-group mb-3">
      <input type="text" class="form-control" id="demo" placeholder="Ctrl+C > Copy liff url.">
      <button class="btn btn-outline-secondary" type="button" onclick="copyUrl()">Copy</button>
    </div>

    <div class="d-flex flex-wrap gap-2">
      <button type="button" class="btn btn-success" onclick="saveShare()">Save liff</button>
      <button type="button" class="btn btn-success" onclick="sendShare()">Share Target Picker</button>
      <button type="button" class="btn btn-warning" onclick="previewFlex()">Preview Flex</button>
    </div>
    <small class="text-muted d-block mt-2">* ปุ่ม Preview จะเรนเดอร์จาก JSON ที่อยู่ในช่อง textarea ตรง ๆ ทุกครั้ง</small>
  </div>

  <!-- Preview -->
  <div class="col-md-6">
    <h4>Preview</h4>
    <div id="previewArea"><p class="text-muted">ยังไม่มี preview</p></div>
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"></script>

<script>
async function saveShare() {
  const sflex = document.getElementById("flexjson").value;
  const alt = document.getElementById("altText").value.trim() || "Flex Preview";
  const lid = "lid" + Date.now();
  const code = window.btoa(sflex);

  document.getElementById("demo").value =
    "https://liff.line.me/2000581772-7YjqnkvM/?flexid=" + lid;

  const xurl = "https://script.google.com/macros/s/AKfycbwktB_ZSm_VDDImG85Q4abmjDcBGHQqusr4PMsoWlT1d9fsADr6NaaM81uBnqq4exVL/exec";

  try {
    const response = await fetch(xurl, {
      method: "POST",
      mode: "cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ lid, desc: code, altText: alt })
    });
    const json = await response.json();
    if (json.status === "success") alert("บันทึกแล้ว: " + json.desc);
    else alert("Error: " + json.message);
  } catch (err) {
    alert("เกิดข้อผิดพลาด: " + err.message);
  }
}

function buildFlexMessageFromTextarea() {
  const raw = document.getElementById("flexjson").value;
  const alt = document.getElementById("altText").value.trim() || "Flex Preview";
  let parsed;
  try { parsed = JSON.parse(raw); } catch { return "failed"; }
  if (parsed.type === 'flex' && parsed.contents) { if (!parsed.altText) parsed.altText = alt; return parsed; }
  if (parsed.type === 'bubble' || parsed.type === 'carousel') return { type: 'flex', altText: alt, contents: parsed };
  return "failed";
}

async function sendShare() {
  const msg = buildFlexMessageFromTextarea();
  if (msg === "failed") { alert("JSON ไม่ถูกต้อง"); return; }
  try { 
    const result = await liff.shareTargetPicker([msg]);
    if(result) alert(`[${result.status}] Message sent!`);
    else alert("ShareTargetPicker ถูกยกเลิก");
  } catch(e){ console.error(e); alert("แชร์ไม่สำเร็จ"); }
}

function copyUrl(){ let copyText=document.getElementById("demo"); copyText.select(); document.execCommand("copy"); alert("Copied URL: "+copyText.value); }

function previewFlex(){
  const preview=document.getElementById('previewArea'); preview.innerHTML='';
  let contents;
  try { 
    const raw = document.getElementById('flexjson').value;
    const json = JSON.parse(raw);
    contents = (json.type==='bubble'||json.type==='carousel')?json:(json.type==='flex'?json.contents:null);
    if(!contents) throw new Error('ชนิด JSON ไม่รองรับ');
    if(contents.type==='carousel'){ contents.contents.forEach(b=>preview.appendChild(renderBubble(b))); }
    else preview.appendChild(renderBubble(contents));
  } catch(e){ preview.innerHTML=`<p class='text-danger'>${e.message}</p>`; }
}

function renderBubble(bubble){
  const wrap=document.createElement('div'); wrap.className='flex-bubble';
  if(bubble.hero) wrap.appendChild(renderComponent(bubble.hero,true));
  if(bubble.header){ const sec=document.createElement('div'); sec.className='section'; sec.appendChild(renderComponent(bubble.header)); wrap.appendChild(sec); }
  if(bubble.body){ const sec=document.createElement('div'); sec.className='section'; sec.appendChild(renderComponent(bubble.body)); wrap.appendChild(sec); }
  if(bubble.footer){ const sec=document.createElement('div'); sec.className='section flex-footer'; sec.appendChild(renderComponent(bubble.footer)); wrap.appendChild(sec); }
  return wrap;
}

function renderComponent(node,isHero=false){
  if(!node) return document.createDocumentFragment();
  const d=document.createElement('div');
  switch(node.type){
    case 'box': d.className='box '+(node.layout||'vertical'); (node.contents||[]).forEach(ch=>d.appendChild(renderComponent(ch))); applyCommonStyle(d,node); return d;
    case 'text': d.className='text '+(node.size||''); d.textContent=node.text||''; if(node.weight==='bold')d.style.fontWeight='700'; if(node.align)d.style.textAlign=node.align; if(node.wrap)d.style.whiteSpace='normal'; else d.style.whiteSpace='nowrap'; if(node.decoration==='underline')d.style.textDecoration='underline'; applyCommonStyle(d,node); return d;
    case 'image': const c=isHero?document.createElement('div'):document.createElement('div'); if(isHero)c.className='flex-hero'; const img=document.createElement('img'); img.src=node.url; img.loading='lazy'; img.style.width='100%'; img.style.objectFit=node.aspectMode==='contain'?'contain':'cover'; applyCommonStyle(img,node); if(node.action&&node.action.type==='uri'){img.style.cursor='pointer'; img.addEventListener('click',()=>window.open(node.action.uri,'_blank'));} c.appendChild(img); return c;
    case 'button': const a=document.createElement('a'); a.textContent=(node.action&&node.action.label)?node.action.label:(node.label||'Button'); a.href=(node.action&&node.action.uri)?node.action.uri:'javascript:void(0)'; a.target='_blank'; a.className='btn-flex '+((node.style||'secondary').toLowerCase()==='primary'?'primary':(node.style==='link'?'link':'')); applyCommonStyle(a,node); return a;
    case 'separator': const hr=document.createElement('div'); hr.className='sep'; applyCommonStyle(hr,node); return hr;
    case 'spacer': const sp=document.createElement('div'); sp.style.height='8px'; return sp;
    case 'filler': const f=document.createElement('div'); f.style.flex='1 1 auto'; return f;
    case 'icon': const i=document.createElement('img'); i.className='icon'; i.src=node.url; return i;
    default: const pre=document.createElement('pre'); pre.textContent='[unsupported '+node.type+']'; pre.style.fontSize='12px'; pre.style.color='#999'; return pre;
  }
}

function applyCommonStyle(el,node={}){ if(!node)return; if(node.margin) el.style.marginTop='8px'; if(node.backgroundColor) el.style.backgroundColor=node.backgroundColor; if(node.color) el.style.color=node.color; if(node.align) el.style.textAlign=node.align; if(node.gravity){ if(node.gravity==='center') el.style.alignSelf='center'; if(node.gravity==='bottom') el.style.alignSelf='flex-end'; } if(node.action&&node.action.type==='uri'){ el.style.cursor='pointer'; el.addEventListener('click',()=>window.open(node.action.uri,'_blank')); } }

async function main(){
  await liff.init({ liffId:"2000581772-7YjqnkvM" });
  if(!liff.isLoggedIn()) liff.login(); else previewFlex();
  let t=null; document.getElementById('flexjson').addEventListener('input',()=>{ clearTimeout(t); t=setTimeout(previewFlex,300); });
}
main();
</script>

</body>
</html>
