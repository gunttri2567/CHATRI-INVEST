<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover">
  <title>CHATRI INVEST</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f8f9fa; padding:20px; }
    textarea { font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">
    <h3 class="text-center mb-4">Chatriliff 2025</h3>

    <form id="flexForm">
      <!-- JSON textarea -->
      <div class="mb-3">
        <label class="form-label">Flex JSON 
          <a href="https://developers.line.biz/flex-simulator" target="_blank" class="link-info">(Flex Simulator)</a>
        </label>
        <textarea class="form-control" id="flexjson" rows="12" onchange="myFunction()">{
  "type": "bubble",
  "body": {
    "type": "box",
    "layout": "vertical",
    "contents": [
      {"type": "text", "text": "hello"}
    ]
  }
}</textarea>
      </div>

      <!-- LIFF URL display -->
      <div class="input-group mb-3">
        <input type="text" class="form-control" id="demo" placeholder="Ctrl+C to copy LIFF URL">
        <button class="btn btn-outline-secondary" type="button" onclick="copyUrl()">Copy</button>
      </div>

      <!-- Flex buttons -->
      <div class="mb-3">
        <button type="button" class="btn btn-outline-primary me-1" onclick="flex_1()">Flex1</button>
        <button type="button" class="btn btn-outline-primary me-1" onclick="flex_2()">Flex2</button>
        <button type="button" class="btn btn-outline-primary me-1" onclick="flex_3()">Flex3</button>
        <button type="button" class="btn btn-outline-primary" onclick="flex_4()">Flex4</button>
      </div>

      <!-- Save & Share -->
      <div class="mb-3">
        <button type="button" class="btn btn-success me-1" onclick="saveShare()">Save LIFF</button>
        <button type="button" class="btn btn-success" onclick="sendShare()">Share Target Picker</button>
      </div>

      <!-- Manual login button -->
      <div class="mb-3">
        <button id="loginBtn" type="button" class="btn btn-warning" style="display:none;" onclick="loginManual()">Login LINE</button>
      </div>
    </form>
  </div>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
  async function main() {
    const LIFF_ID = "2000581772-8mWaqgk1"; // ✅ ใส่ LIFF ID ของคุณ
    await liff.init({ liffId: LIFF_ID });

    if (liff.isLoggedIn()) {
      console.log("User is logged in.");
      js_onload_code();
    } else {
      document.getElementById("loginBtn").style.display = "block";
    }
  }

  function loginManual() { liff.login(); }

  // โหลดค่า flexid จาก URL
  function js_onload_code() {
    const params = new URLSearchParams(window.location.search);
    const exc = params.get('flexid');
    if (!exc) return;

    const xurl = "https://script.google.com/macros/s/AKfycbwktB_ZSm_VDDImG85Q4abmjDcBGHQqusr4PMsoWlT1d9fsADr6NaaM81uBnqq4exVL/exec"; // ✅ แก้เป็น WebApp ของ GAS
    const xmlhttp = new XMLHttpRequest();
    xmlhttp.open('GET', xurl + '?flexid=' + exc);
    xmlhttp.send();
    xmlhttp.onreadystatechange = function() {
      if (this.readyState === 4 && this.status === 200) {
        try {
          const jsonResponse = JSON.parse(this.responseText);
          if (jsonResponse.desc) {
            const decoded = window.atob(jsonResponse.desc);
            document.getElementById("flexjson").value = decoded;
          }
        } catch(err) { console.error("Error parsing response:", err); }
      }
    }
  }

  // Flex buttons
  function flex_1() { setFlexText("start"); }
  function flex_2() { setFlexText("center"); }
  function flex_3() { setFlexText("end"); }
  function flex_4() {
    const f = { "type":"bubble","body":{"type":"box","layout":"vertical","contents":[{"type":"text","text":"hello","color":"#ff0000"}]}};
    document.getElementById("flexjson").value = JSON.stringify(f, null, 2);
  }
  function setFlexText(align) {
    const f = { "type":"bubble","body":{"type":"box","layout":"vertical","contents":[{"type":"text","text":"hello","align":align}]}};
    document.getElementById("flexjson").value = JSON.stringify(f, null, 2);
  }

  // ตรวจ JSON
  function myFunction() {
    const x = document.getElementById("flexjson").value;
    try {
      const obj = JSON.parse(x);
      return { type:"flex", altText:"Flex", contents: obj };
    } catch(err) {
      console.error(err);
      return "failed";
    }
  }

  // Save & Share
  function saveShare() {
    const sflex = document.getElementById("flexjson").value;
    const code = window.btoa(sflex);
    const lid = "lid" + Date.now();
    document.getElementById("demo").value = "https://liff.line.me/2000581772-8mWaqgk1/?flexid=" + lid;

    const xurl = "https://script.google.com/macros/s/AKfycbwktB_ZSm_VDDImG85Q4abmjDcBGHQqusr4PMsoWlT1d9fsADr6NaaM81uBnqq4exVL/exec"; // ✅ ใส่ URL WebApp ของ GAS
    const xmlhttp = new XMLHttpRequest();
    xmlhttp.open("POST", xurl);
    xmlhttp.setRequestHeader("Content-Type","application/json;charset=UTF-8");
    xmlhttp.send(JSON.stringify({ lid, desc: code }));

    xmlhttp.onreadystatechange = function() {
      if (this.readyState === 4 && this.status === 200) {
        try {
          const jsonResponse = JSON.parse(this.responseText);
          if (jsonResponse.desc) alert("บันทึกแล้ว: " + jsonResponse.desc);
        } catch(err) { console.error(err); }
      }
    }
  }

  async function sendShare() {
    const flexObj = myFunction();
    if (flexObj !== "failed") {
      const result = await liff.shareTargetPicker([flexObj]);
      if (result) {
        alert(`[${result.status}] Message sent!`);
        liff.closeWindow();
      } else {
        alert("ShareTargetPicker canceled.");
      }
    } else {
      alert("JSON Incorrect.");
    }
  }

  function copyUrl() {
    let copyText = document.getElementById("demo");
    copyText.select();
    document.execCommand("copy");
    alert("Copied URL: " + copyText.value);
  }

  // Init
  main();
  </script>
</body>
</html>
